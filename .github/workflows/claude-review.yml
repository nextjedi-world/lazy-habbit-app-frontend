# Claude reviews PRs against the linked Linear issue. Skipped until the repo variable
# CLAUDE_REVIEW_ENABLED is 'true' (set it after adding the CLAUDE_CODE_OAUTH_TOKEN secret).
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: vars.CLAUDE_REVIEW_ENABLED == 'true'
    uses: nextjedi/platform/.github/workflows/claude-review.yml@main
    secrets: inherit
